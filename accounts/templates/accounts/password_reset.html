{% extends "base.html" %}
{% block title %}بازیابی رمز عبور | مکتب‌پلاس{% endblock %}
{% block content %}
<section class="container-x pt-10 pb-24">
  <div class="max-w-md mx-auto glass-strong rounded-3xl p-8">
    <h1 class="text-2xl font-black mb-2">بازیابی رمز عبور 🔑</h1>
    <p class="text-slate-500 text-sm leading-7 mb-6">ایمیل حسابت رو وارد کن؛ لینک تنظیم رمز جدید برات ارسال می‌شه.</p>
    <form method="post" class="space-y-4">
      {% csrf_token %}
      <div>
        <label class="label" for="id_email">ایمیل</label>
        <input type="email" name="email" id="id_email" required class="input" placeholder="you@example.com" dir="ltr">
      </div>
      <button class="btn btn-primary w-full btn-lg">ارسال لینک بازیابی</button>
    </form>
    <p class="text-center text-sm text-slate-500 mt-5"><a href="{% url 'accounts:login' %}" class="text-violet-600 font-bold hover:underline">برگشت به صفحه‌ی ورود</a></p>
  </div>
</section>
{% endblock %}
