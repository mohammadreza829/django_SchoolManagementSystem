name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-latest

    env:
      # این کلید فقط برای CI است و هیچ ارزش امنیتی واقعی ندارد
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      # عمداً True: با DEBUG=False گزینهٔ SECURE_SSL_REDIRECT فعال می‌شود
      # و تست‌کلاینت جنگو به‌جای 200 پاسخ 301 می‌گیرد.
      DJANGO_DEBUG: "True"
      # در CI سراغ پستگرس نمی‌رویم؛ اسکلایت کافی و سریع‌تر است
      DJANGO_DB_ENGINE: sqlite
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test courses quiz -v 2
