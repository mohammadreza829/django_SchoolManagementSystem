name: One-time Django template comment fix

on:
  push:
    paths:
      - .github/workflows/fix-django-template-comment.yml

permissions:
  contents: write

jobs:
  fix-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace invalid multiline Django comment
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("templates/base.html")
          text = path.read_text(encoding="utf-8")
          old = """    {# ============================================================
                 هدر — در دسکتاپ منوی افقی، در موبایل/تبلت شیت کشویی
                 open فقط منوی موبایل را کنترل می‌کند و با کلیک روی لینک،
                 کلیک روی پوشش، کلید Escape و بزرگ‌شدن صفحه بسته می‌شود.
                 ============================================================ #}
          """
          new = """    {% comment %}
              هدر — در دسکتاپ منوی افقی، در موبایل/تبلت شیت کشویی.
              منوی موبایل با لینک، پوشش، Escape و تغییر اندازه بسته می‌شود.
              {% endcomment %}
          """
          if old not in text:
              raise SystemExit("Expected invalid multiline comment was not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/base.html
          git commit -m "fix(ui): prevent Django template comment leaking into page"
          git push origin main
