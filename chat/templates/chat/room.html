<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>چت‌روم — {{ course.title }}</title>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root { color-scheme: light; }
    * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
    body { margin: 0; background: #f3f5f9; color: #1a1f2e; }
    .wrap { max-width: 820px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
    .topbar { background: #ffffff; border-bottom: 1px solid rgba(15,23,42,0.09); padding: 14px 18px; display: flex; align-items: center; gap: 12px; box-shadow: 0 1px 0 rgba(15,23,42,0.03); }
    .topbar h1 { font-size: 16px; margin: 0; font-weight: 700; }
    .topbar a { color: #5a6477; text-decoration: none; font-size: 14px; }
    .topbar a:hover { color: #14192a; }
    .messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
    .older { text-align: center; padding: 2px 0; display: none; }
    .older button { background: #ffffff; border: 1px solid rgba(15,23,42,0.12); color: #5a6477; border-radius: 999px; padding: 6px 16px; font-size: 12px; cursor: pointer; }
    .older button:hover { color: #14192a; border-color: #a855f7; }
    .msg { position: relative; max-width: 78%; padding: 9px 13px; border-radius: 14px; background: #ffffff; border: 1px solid rgba(15,23,42,0.07); color: #1a1f2e; align-self: flex-start; }
    .msg.mine { align-self: flex-end; background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; }
    .msg.announce { align-self: stretch; max-width: 100%; background: #22c55e22; border: 1px solid #22c55e88; }
    .msg .meta { font-size: 11px; opacity: 0.75; margin-bottom: 3px; }
    .msg .text { font-size: 14px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }
    .msg .time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: left; }
    .msg .del { position: absolute; top: 4px; left: 6px; background: none; border: none; cursor: pointer; color: inherit; opacity: 0; font-size: 11px; padding: 2px; transition: opacity .15s; }
    .msg:hover .del { opacity: .55; }
    .msg .del:hover { opacity: 1; }
    .composer { border-top: 1px solid rgba(15,23,42,0.09); background: #ffffff; padding: 12px 16px; }
    .composer form { display: flex; gap: 8px; align-items: center; }
    .composer input[type=text] { flex: 1; background: #f7f8fc; border: 1px solid rgba(15,23,42,0.12); color: #1a1f2e; border-radius: 10px; padding: 11px 14px; font-size: 14px; outline: none; }
    .composer input[type=text]:focus { border-color: #a855f7; box-shadow: 0 0 0 3px rgba(168,85,247,.15); }
    .composer button { background: linear-gradient(135deg,#7c3aed,#a855f7); color: #fff; border: none; border-radius: 10px; padding: 11px 18px; cursor: pointer; font-size: 14px; }
    .composer button:hover { background: #7c3aed; }
    .ann { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #22c55e; cursor: pointer; white-space: nowrap; }
    .empty { text-align: center; color: #6b7280; margin-top: 40px; font-size: 14px; }
    .toast { position: fixed; bottom: 80px; right: 50%; transform: translateX(50%); background: #ef4444; color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 13px; display: none; z-index: 50; box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  </style>
</head>
<body>
  <div class="wrap" id="chat-root"
       data-messages-url="{% url 'chat:messages' course.id %}"
       data-send-url="{% url 'chat:send' course.id %}"
       data-delete-url="{% url 'chat:delete' course.id 0 %}"
       data-is-teacher="{% if is_teacher %}1{% else %}0{% endif %}">
    <div class="topbar">
      <a href="{% url 'courses:course_detail' course.slug %}"><i class="fa-solid fa-arrow-right"></i></a>
      <i class="fa-solid fa-comments" style="color:#6366f1"></i>
      <h1>چت‌روم دوره: {{ course.title }}</h1>
    </div>

    <div class="messages" id="messages">
      <div class="older" id="older-wrap"><button type="button" id="older-btn">نمایش پیام‌های قبلی</button></div>
      <div class="empty" id="empty-state">هنوز پیامی نیست. اولین پیام را بفرستید 👋</div>
    </div>

    <div class="composer">
      <form id="send-form">
        {% csrf_token %}
        {% if is_teacher %}
        <label class="ann" title="پیام به‌عنوان اعلان رسمی نمایش داده می‌شود">
          <input type="checkbox" name="is_announcement" value="1"> اعلان
        </label>
        {% endif %}
        <input id="text-input" name="text" type="text" autocomplete="off" maxlength="2000" placeholder="پیام خود را بنویسید...">
        <button type="submit"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
  (function () {
    var root = document.getElementById("chat-root");
    var messagesUrl = root.dataset.messagesUrl;
    var sendUrl = root.dataset.sendUrl;
    var deleteUrl = root.dataset.deleteUrl; // به شکل .../delete/0/
    var isTeacher = root.dataset.isTeacher === "1";
    var csrf = document.querySelector("[name=csrfmiddlewaretoken]").value;
    var box = document.getElementById("messages");
    var empty = document.getElementById("empty-state");
    var olderWrap = document.getElementById("older-wrap");
    var olderBtn = document.getElementById("older-btn");
    var toast = document.getElementById("toast");
    var form = document.getElementById("send-form");
    var input = document.getElementById("text-input");

    var lastId = 0;
    var oldestId = 0;
    var atBottom = true;
    // polling تطبیقی: چت فعال → سریع، چت ساکت → کند (کاهش فشار سرور)
    var BASE_DELAY = 3000, MAX_DELAY = 20000;
    var pollDelay = BASE_DELAY;
    var pollTimer = null;
    var toastTimer = null;

    box.addEventListener("scroll", function () {
      atBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 60;
    });

    function esc(s) {
      var d = document.createElement("div");
      d.textContent = s == null ? "" : s;
      return d.innerHTML;
    }

    function showToast(text) {
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function () { toast.style.display = "none"; }, 3000);
    }

    function buildEl(m) {
      if (empty) { empty.style.display = "none"; }
      var wrap = document.createElement("div");
      var cls = "msg";
      if (m.is_mine) { cls += " mine"; }
      if (m.is_announcement) { cls += " announce"; }
      wrap.className = cls;
      var meta;
      if (m.is_announcement) {
        meta = "\uD83D\uDCE2 اعلان • " + esc(m.sender);
      } else {
        meta = esc(m.sender) + (m.is_teacher ? " (استاد)" : "");
      }
      var html = "";
      html += '<div class="meta">' + meta + '</div>';
      html += '<div class="text">' + esc(m.text) + '</div>';
      html += '<div class="time">' + esc(m.time) + '</div>';
      wrap.innerHTML = html;
      if (m.is_mine || isTeacher) {
        var del = document.createElement("button");
        del.type = "button";
        del.className = "del";
        del.title = "حذف پیام";
        del.innerHTML = "&#10005;";
        del.addEventListener("click", function () { removeMsg(m.id, wrap); });
        wrap.appendChild(del);
      }
      return wrap;
    }

    function appendMsg(m) {
      box.appendChild(buildEl(m));
      if (m.id > lastId) { lastId = m.id; }
      if (!oldestId || m.id < oldestId) { oldestId = m.id; }
    }

    function removeMsg(id, el) {
      if (!window.confirm("این پیام حذف شود؟")) { return; }
      fetch(deleteUrl.replace(/\/0\/$/, "/" + id + "/"), {
        method: "POST",
        headers: { "X-CSRFToken": csrf }
      })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (d && d.ok) { el.remove(); }
          else { showToast("حذف پیام ممکن نشد"); }
        })
        .catch(function () { showToast("حذف پیام ممکن نشد"); });
    }

    function schedule(delay) {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(poll, delay);
    }

    function poll() {
      if (document.hidden) { schedule(pollDelay); return; }
      fetch(messagesUrl + "?after=" + lastId, {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var msgs = (data && data.messages) || [];
          if (msgs.length) {
            for (var i = 0; i < msgs.length; i++) { appendMsg(msgs[i]); }
            if (atBottom) { box.scrollTop = box.scrollHeight; }
            pollDelay = BASE_DELAY;
          } else {
            pollDelay = Math.min(pollDelay * 1.5, MAX_DELAY);
          }
          schedule(pollDelay);
        })
        .catch(function () {
          pollDelay = Math.min(pollDelay * 2, MAX_DELAY);
          schedule(pollDelay);
        });
    }

    function loadOlder() {
      if (!oldestId) { return; }
      fetch(messagesUrl + "?before=" + oldestId, {
        headers: { "X-Requested-With": "XMLHttpRequest" }
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          var msgs = (data && data.messages) || [];
          var prevHeight = box.scrollHeight;
          var ref = olderWrap.nextSibling;
          for (var i = 0; i < msgs.length; i++) {
            var m = msgs[i];
            box.insertBefore(buildEl(m), ref);
            if (!oldestId || m.id < oldestId) { oldestId = m.id; }
          }
          box.scrollTop += box.scrollHeight - prevHeight;
          olderWrap.style.display = (data && data.has_more) ? "block" : "none";
        })
        .catch(function () {});
    }

    olderBtn.addEventListener("click", loadOlder);

    // وقتی کاربر به تب برمی‌گردد، فوری poll کن
    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) { pollDelay = BASE_DELAY; poll(); }
    });

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) { return; }
      var body = new FormData(form);
      fetch(sendUrl, {
        method: "POST",
        headers: { "X-CSRFToken": csrf },
        body: body
      })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (data && data.ok) {
            input.value = "";
            var ann = form.querySelector("[name=is_announcement]");
            if (ann) { ann.checked = false; }
            appendMsg(data.message);
            box.scrollTop = box.scrollHeight;
            pollDelay = BASE_DELAY;
            schedule(pollDelay);
          } else {
            showToast((data && data.error) || "ارسال پیام ممکن نشد");
          }
        })
        .catch(function () { showToast("ارسال پیام ممکن نشد"); });
    });

    // بارگذاری اولیه: آخرین پیام‌ها (نه قدیمی‌ترین‌ها!)
    fetch(messagesUrl, { headers: { "X-Requested-With": "XMLHttpRequest" } })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var msgs = (data && data.messages) || [];
        for (var i = 0; i < msgs.length; i++) { appendMsg(msgs[i]); }
        box.scrollTop = box.scrollHeight;
        if (data && data.has_more) { olderWrap.style.display = "block"; }
        schedule(pollDelay);
      })
      .catch(function () { schedule(pollDelay); });
  })();
  </script>
</body>
</html>
